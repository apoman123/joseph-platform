# Secret scanning config: gitleaks defaults plus a narrow allowlist for
# deliberately fake credentials that redaction tests assert are never leaked.
title = "joseph"

[extend]
useDefault = true

[allowlist]
description = "Fake credentials used by redaction/security tests"
paths = [
  '''joseph-execution-engine/tests/security/test_security\.py''',
]
# Exact fake or published values only; anything else still fails the scan.
regexes = [
  # Binance USDⓈ-M docs' HMAC example secret (public signing test vector).
  '''^2b5eb11e18796d12d88f13dc27dbbd02c2cc51ff7059765ed9821957d82bb4d9$''',
  # MEXC docs' example access key; fake adapter-test credentials.
  '''^mx0aBYs33eIilxBW5C$''',
  '''^LIVE-SECRET-binance-77$''',
  '''^secret-123456$''',
  # Base32 TOTP secret of the system-test execution engine only.
  '''^NJXXGZLQNAWXG6LTORSW2LLUMVZXILJR$''',
  # TWSE/TPEx MIS record keys (market, code, date) in captured fixtures.
  '''^(tse|otc)_[0-9A-Z]{4,6}\.tw_[0-9]{8}$''',
  # Alpaca pagination token in a documented-shape fixture (base64 of a cursor).
  '''^QUFQTHxNfDIwMjYtMTEtMjBUMTQ6MzI6MDAuMDAwMDAwMDAwWg==$''',
  # Multi-symbol daily-bars pagination token (base64 of "AAPL|2026-11-19").
  '''^QUFQTHwyMDI2LTExLTE5$''',
]

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Pinned source SHA-256 checksums, validated by upstream:check"
  condition = "AND"
  paths = ['''^joseph\-terminal/third_party/tradex/UPSTREAM\.json$''']
  regexes = ['''^[0-9a-f]{64}$''']

  [[rules.allowlists]]
  description = "IANA timezone identifiers in unchanged upstream chart bundle"
  condition = "AND"
  paths = ['''^joseph\-terminal/third_party/tradex/hub/vendor/klinecharts\-pro\.umd\.js$''']
  regexes = ['''^(America/Chicago|Australia/Sydney)$''']

  [[rules.allowlists]]
  description = "Public instrument symbol keys in unchanged upstream metadata"
  condition = "AND"
  paths = ['''^joseph\-terminal/third_party/tradex/hub/web/data/instruments\.json$''']
  regexes = ['''^(CSOPSKHYNIX2LUSD|BROCCOLI714USD)$''']

[[rules]]
id = "coinbase-access-token"

  [[rules.allowlists]]
  description = "Pinned source SHA-256 checksums, validated by upstream:check"
  condition = "AND"
  paths = ['''^joseph\-terminal/third_party/tradex/UPSTREAM\.json$''']
  regexes = ['''^[0-9a-f]{64}$''']

[[rules]]
id = "jwt"

  [[rules.allowlists]]
  description = "Published upstream Supabase anon browser key; inert reference, never used by Joseph"
  condition = "AND"
  paths = ['''^joseph\-terminal/third_party/tradex/hub/web/auth_config\.json$''']
  regexes = ['''^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkYW1maXZoZm9yZ3dzemR6YXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1NDUxMzcsImV4cCI6MjExMTEyMTEzN30\.QUq9q\-Uetmpeq9kgc9lP2gwzJpZLczjaHtgx81myztE$''']
