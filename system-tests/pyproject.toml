[project]
name = "joseph-system-tests"
version = "0.5.0"
description = "Cross-service system tests: boots the market and execution engines and drives end-to-end flows over HTTP and WebSocket."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "httpx>=0.27,<1",
  "websockets>=13,<17",
  "jsonschema>=4.23,<5",
  "ruff>=0.8,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "-q --strict-markers --import-mode=importlib"
pythonpath = ["."]
markers = ["load: latency/throughput smoke checks"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "B", "UP"]
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
