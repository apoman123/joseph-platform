# Static analysis and supply-chain checks. Runs on pushes to main, on pull
# requests and weekly (new advisories appear without code changes).
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 03:17 UTC.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL — ${{ matrix.language }}
    # Code scanning on private repositories needs GitHub Advanced Security;
    # set the repository variable CODE_SCANNING_ENABLED=true once it is on.
    if: ${{ !github.event.repository.private || vars.CODE_SCANNING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      # The whole history, so a secret removed in a later commit is found.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && (!github.event.repository.private || vars.CODE_SCANNING_ENABLED == 'true')
    runs-on: ubuntu-latest
    # pull-requests: write posts the summary comment on a failure.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          comment-summary-in-pr: on-failure

  audit:
    name: Vulnerability audit (npm + Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: joseph-terminal/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm production dependencies
        working-directory: joseph-terminal
        run: pnpm audit --prod --audit-level high
      - name: Python dependencies
        run: |
          for project in joseph-market-engine joseph-execution-engine; do
            (cd "$project" && uv export --frozen --no-dev --no-hashes \
              --no-emit-project -o /tmp/req-$project.txt)
            uvx pip-audit -r /tmp/req-$project.txt --no-deps --disable-pip
          done
