# Grants a job read access to the private indicator library
# (apoman123/PineScripts, python_indicators/), which uv installs over HTTPS.
#
# Setup (once): create a fine-grained personal access token limited to
# apoman123/PineScripts with Contents: read-only and store it in this
# repository as the Actions and Dependabot secret PINESCRIPTS_TOKEN. See
# docs/CI_CD.md.
name: Indicator library access
description: Lets git, and so uv, fetch apoman123/PineScripts with a read-only token.

inputs:
  token:
    description: Fine-grained token with read access to apoman123/PineScripts (secret).
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if [ -z "${TOKEN}" ]; then
          echo "::error title=Missing PINESCRIPTS_TOKEN::The market engine depends on the private apoman123/PineScripts repository. Create a fine-grained token with Contents: read-only on PineScripts only and store it as the Actions secret PINESCRIPTS_TOKEN (and the Dependabot secret of the same name); see docs/CI_CD.md."
          exit 1
        fi
        echo "::add-mask::${TOKEN}"
        # Scoped to the one repository: other github.com URLs are untouched.
        git config --global \
          url."https://x-access-token:${TOKEN}@github.com/apoman123/PineScripts".insteadOf \
          "https://github.com/apoman123/PineScripts"
