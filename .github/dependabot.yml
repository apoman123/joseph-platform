version: 2
# The market engine's git dependency on the private apoman123/PineScripts.
# The token is a Dependabot secret: Dependabot cannot read Actions secrets.
registries:
  pinescripts:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.PINESCRIPTS_TOKEN}}
updates:
  - package-ecosystem: npm
    directory: /joseph-terminal
    schedule: {interval: weekly}
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        dependency-type: development
      react-next:
        patterns: ['react', 'react-dom', 'next', '@types/react*']
  - package-ecosystem: uv
    directory: /joseph-market-engine
    registries: [pinescripts]
    schedule: {interval: weekly}
  - package-ecosystem: uv
    directory: /joseph-execution-engine
    schedule: {interval: weekly}
  - package-ecosystem: uv
    directory: /system-tests
    schedule: {interval: monthly}
  - package-ecosystem: docker
    directories: [/joseph-market-engine, /joseph-execution-engine, /joseph-terminal]
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/deploy]
    schedule: {interval: weekly}
