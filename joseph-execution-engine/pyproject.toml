[project]
name = "joseph-execution-engine"
version = "0.5.0"
description = "Joseph execution engine: private trust boundary for accounts, credentials, risk gateway, OMS, reconciliation, audit and kill switch."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - private repository" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "websockets>=13,<17",
  "sqlalchemy>=2.0,<3",
  "cryptography>=49.0.0,<51",
]

[project.optional-dependencies]
# Interactive Brokers through IB Gateway/TWS (BSD-2-Clause).
ibkr = ["ib_async>=2.1,<3"]
# SinoPac Shioaji (SinoPac's proprietary SDK; binary abi3 wheels).
sinopac = ["shioaji>=1.7.11,<2"]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "hypothesis>=6.100,<7",
  "jsonschema>=4.23,<5",
  "respx>=0.21,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "import-linter>=2.1,<3",
  "pip-licenses>=5,<6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joseph_execution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "network: hits real public venue APIs (opt-in with JOSEPH_NETWORK_TESTS=1)",
  "slow: long-running replay or property tests",
  "ibkr_paper: places orders on an IB Gateway paper account (opt-in with JOSEPH_IBKR_PAPER_TESTS=1)",
  "sinopac_sim: places orders in Shioaji simulation (opt-in with JOSEPH_SINOPAC_SIM_TESTS=1)",
]
addopts = "-q --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 80
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "A", "C4", "SIM", "RET", "PL", "RUF", "S", "ASYNC", "DTZ", "T20"]
ignore = [
  "D107",    # __init__ args are documented in the class docstring (Google style).
  "PLR0913", # Explicit constructor injection can need many parameters.
  "PLR2004", # Domain thresholds are named in specs; magic-value checks are noisy.
  "S101",    # assert is used in tests.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "D104"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["joseph_execution"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["joseph_execution"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["websockets.*"]
ignore_missing_imports = true
