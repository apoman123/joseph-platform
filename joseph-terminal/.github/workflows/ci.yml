# Public repository CI for joseph-terminal.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contracts are generated from schemas
        run: pnpm contracts:check
      - name: Format, lint (Google TS style), typecheck
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
      - name: Unit, component, contract and architecture tests
        run: pnpm test:coverage
      - name: Dependency boundaries
        run: pnpm arch:check
      - name: Secret and license scans
        run: |
          pnpm secrets:scan
          pnpm licenses:check
          pnpm audit --prod --audit-level high
      - name: Production build
        run: pnpm build
      - name: Browser system tests (DEMO mode) + accessibility
        run: |
          pnpm --filter @joseph/web exec playwright install --with-deps chromium
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: |
            apps/web/e2e/screenshots
            apps/web/playwright-report
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
