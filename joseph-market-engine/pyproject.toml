[project]
name = "joseph-market-engine"
version = "0.6.0"
description = "Joseph market engine: venue market data, qualification filter, indicator plugins, strategy AST evaluation, signals, alerts and backtests."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "websockets>=13,<18",
  "sqlalchemy>=2.0,<3",
  # IANA time zones of exchange sessions; zoneinfo falls back to this
  # package where the OS has no time zone database.
  "tzdata>=2025.1",
  # Remote Parquet reads of the Lighter trade archive (column chunks only).
  "pyarrow>=26,<27",
  # MEXC futures WebSocket Protobuf pushes (BSD-3-Clause; decoded with
  # runtime-built descriptors, no generated code).
  "protobuf>=6.31.1,<8",
  "ccxt>=4.5,<5",
  "python-dotenv>=1.2,<2",
  "pywebpush>=2.3,<3",
  "requests>=2.32.5,<3",
  "cryptography>=49,<51",
  "py-vapid>=1.9,<2",
  "mcp>=2,<3",
  "docker>=7,<9",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "hypothesis>=6.100,<7",
  "jsonschema>=4.23,<5",
  "respx>=0.21,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "import-linter>=2.1,<3",
  "pip-licenses>=5,<6",
  "types-protobuf>=6.30",
  "pydoclint>=0.12,<0.13",
  "types-jsonschema>=4.23",
  "types-requests>=2.32,<3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joseph", "src/joseph_script"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "network: hits real public venue APIs (opt-in with JOSEPH_NETWORK_TESTS=1)",
  "slow: long-running replay or property tests",
]
# importlib imports test modules without changing sys.path, so test files
# in different directories may share a name.
addopts = "-q --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 80
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Families mapped to Google Python Style Guide sections ("pyguide"); see
# docs/standards/CODING_STANDARDS.md.
select = [
  "E", "F", "W", "I", "N", "D", "UP", "B", "A", "C4", "SIM", "RET", "PL",
  "RUF", "S", "ASYNC", "DTZ", "T20",
  "ARG",     # pyguide 2.1: unused arguments (`del name  # Unused.`).
  "BLE",     # pyguide 2.4: catch Exception only at isolation points.
  "ERA",     # pyguide 3.8.5: comments explain code, never hold old code.
  "FURB129", # pyguide 2.8: iterate files directly, not `.readlines()`.
  "G",       # pyguide 3.10.1: logging takes a %-pattern literal.
  "PGH",     # pyguide 2.1, 3.19.7: noqa/type: ignore name their codes.
  "TD",      # pyguide 3.12: `# TODO(link): explanation`.
]
ignore = [
  "D107",    # GPY011 (test_code_standards.py) already requires it.
  "PLR0913", # Explicit constructor injection can need many parameters.
  "PLR2004", # Domain thresholds are named in specs; magic-value checks are noisy.
  "TD003",   # pyguide 3.12 puts the link inside TODO(...), not below it.
  "UP040",   # pyguide 3.19.6: `X: TypeAlias = ...`; `type X` changes runtime.
]
# Codes checked outside ruff, kept in `# noqa` comments: pydoclint (DOC) and
# tests/architecture/test_code_standards.py (GPY).
external = ["DOC", "GPY"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests may assert and hold fake secrets (S), run long scenarios (PLR), need
# no package docstrings (D104) and take fixtures they do not use (ARG).
"tests/**" = ["S", "PLR", "D104", "ARG"]
# Built-in scripts declare INPUTS/REQUESTS as plain class attributes, like
# tenant scripts; joseph_script.Script types them as ClassVar.
"src/joseph/scripts/builtin/**" = ["RUF012"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["joseph", "joseph_script"]

[tool.pydoclint]
# Google docstrings without types (annotations carry them). Section-less
# docstrings, Raises and class Attributes are checked by
# tests/architecture/test_code_standards.py (GPY012-GPY015) instead.
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
skip-checking-short-docstrings = true
skip-checking-raises = true
check-class-attributes = false
allow-init-docstring = true
native-mode-noqa-location = "definition"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["websockets.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pywebpush", "py_vapid"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyarrow ships no type information (no py.typed marker).
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
