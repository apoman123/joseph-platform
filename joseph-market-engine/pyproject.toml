[project]
name = "joseph-market-engine"
version = "0.5.0"
description = "Joseph market engine: venue market data, qualification filter, indicator plugins, strategy AST evaluation, signals, alerts and backtests."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - private repository" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "websockets>=13,<17",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2025.1",
  # Remote Parquet reads of the Lighter trade archive (column chunks only).
  "pyarrow>=26,<27",
  "joseph-smc-indicators",
  # MEXC futures WebSocket Protobuf pushes (BSD-3-Clause; decoded with
  # runtime-built descriptors, no generated code).
  "protobuf>=6.31.1,<8",
]

[project.optional-dependencies]
# SinoPac Shioaji market data for TWSE/TPEx (JOSEPH_TW_DATA_SOURCE=sinopac):
# SinoPac's proprietary SDK, binary abi3 wheels for Linux x86_64/aarch64,
# macOS and Windows. Same pin as the execution engine.
sinopac = ["shioaji>=1.7.11,<2"]

[tool.uv.sources]
# Indicator algorithms live in the private apoman123/PineScripts repository
# (python_indicators/). Pinned to a commit; bump `rev` to adopt new ports.
joseph-smc-indicators = { git = "https://github.com/apoman123/PineScripts.git", rev = "e9720b9f7e10e9b6ca27c1a5897ded29f0f6bc48", subdirectory = "python_indicators" }

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "hypothesis>=6.100,<7",
  "jsonschema>=4.23,<5",
  "respx>=0.21,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "import-linter>=2.1,<3",
  "pip-licenses>=5,<6",
  "types-protobuf>=6.30",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joseph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "network: hits real public venue APIs (opt-in with JOSEPH_NETWORK_TESTS=1)",
  "slow: long-running replay or property tests",
  "sinopac_data: reads real SinoPac Shioaji market data (opt-in with JOSEPH_SINOPAC_DATA_TESTS=1 and credentials)",
]
addopts = "-q --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 80
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "A", "C4", "SIM", "RET", "PL", "RUF", "S", "ASYNC", "DTZ", "T20"]
ignore = [
  "D107",    # __init__ args are documented in the class docstring (Google style).
  "PLR0913", # Explicit constructor injection can need many parameters.
  "PLR2004", # Domain thresholds are named in specs; magic-value checks are noisy.
  "S101",    # assert is used in tests.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "D104"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["joseph"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["joseph"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["websockets.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyarrow ships no type information (no py.typed marker).
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
